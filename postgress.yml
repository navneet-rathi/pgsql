---
- name: launch job from localhost and add data to remote server
  hosts: localhost
  vars:
    pg_user: nrathi
    pg_password: primod123
    local_csv_path: userdata.csv
    db_name: patching
    db_host: 192.168.64.41
    db_port: 5432
    table_name: userdata

  become: false
  gather_facts: false
  collections:
    - community.postgresql

  tasks:
    - name: Add data to remote server
      community.postgresql.postgresql_db:
        name: patching
        state: present
        login_user: nrathi
        login_password: primod123
        login_host: 192.168.64.41

    - name: Create a table in the remote server
      community.postgresql.postgresql_table:
        name: userdata
        login_db: patching
        state: present
        columns:
          - id serial primary key
          - fname text
          - lname text
        login_user: nrathi
        login_password: primod123
        login_host: 192.168.64.41

