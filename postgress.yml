    #    dst: userdata
    #    copy_from: userdata.csv
    #    options:
    #      delimiter: ','
    #      header: true
    #      format: csv

    - name: Read local CSV file into memory
      community.general.read_csv:
        path: "{{ local_csv_path }}"
      register: csv_data

    - name: Bulk insert all rows in a single network request
      community.postgresql.postgresql_query:
        login_db: "{{ db_name }}"
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_user: "{{ pg_user }}"
        login_password: "{{ pg_password }}"
        query: |
          INSERT INTO {{ table_name }} (id, fname, lname)
          VALUES 
          {% for row in item %}
          ('{{ row.Id }}', '{{ row.fname }}', '{{ row.lname }}'){% if not loop.last %},{% endif %}
          {% endfor %};
      loop: "{{ csv_data.list | slice( (csv_data.list | length / chunk_size) | text | float | ceil | int ) }}"    
      delegate_to: localhost    